
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      text-align: center;
      padding: 60px 20px;
    }
    .card {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #0001;
    }
    h1 { color: #2563eb; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Website!</h1>
    <p>Hello! I am learning how to deploy websites.</p>
    <p>This is my first web development project.</p>
    <button onclick="showMessage()">Click Me</button>
    <p id="message"></p>
  </div>
  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Congratulations! Your website is working!";
    }
  </script>
</body>
</html>
